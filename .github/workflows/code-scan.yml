name: code-scan
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: code-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps for diff script (optional)
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml || true

      - name: Collect diff
        run: |
          python scripts/collect_diff.py > scan_payload.json
          cat scan_payload.json | jq 'keys' || true

      - name: Call scanner Lambda URL (retry)
        env:
          SCAN_FN_URL: ${{ secrets.SCAN_FN_URL }}
        run: |
          for i in 1 2 3; do
            echo "Attempt $i..."
            if curl -sS -X POST "$SCAN_FN_URL" \
                 -H "Content-Type: application/json" \
                 --data-binary @scan_payload.json > scan_result.json; then
              break
            fi
            sleep $((i*i))
          done
          # Do not fail the job if non-JSON
          if jq -e . >/dev/null 2>&1 < scan_result.json; then
            echo "---- Findings ----"
            jq '.summary, (.findings[]? | {file, title, severity, category, confidence}), {errors: .errors}' scan_result.json
          else
            echo "(non-JSON response from scanner; printing raw)"
            cat scan_result.json
          fi
